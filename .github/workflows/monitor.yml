name: Baja waitlist monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub sometimes runs these a few minutes late)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check waitlists
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 monitor.py
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "waitlist-bot"
            git config user.email "waitlist-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update waitlist state"
            git push
          fi
